# Example values for a 3-node in-cluster MoCache deployment.
# Client SDKs must use the same replica count and DNS names:
#   http://{{ name }}-0.{{ name }}-headless.{{ namespace }}.svc.cluster.local:8090
#   http://{{ name }}-1.{{ name }}-headless.{{ namespace }}.svc.cluster.local:8090
#   http://{{ name }}-2.{{ name }}-headless.{{ namespace }}.svc.cluster.local:8090

nameOverride: cache
fullnameOverride: ""

# With resp.cluster.enabled, this must equal shards * replicasPerShard.
replicaCount: 3

image:
  repository: mocache
  tag: "0.1.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Item-count cap per pod. Also set maxBytes below the container memory limit.
capacity: 100000
maxBytes: 268435456 # 256Mi payload budget (keys+values+overhead)
maxValue: 1048576   # 1Mi per value
maxKey: 4096
# Go soft heap cap (debug.SetMemoryLimit). Keep below resources.limits.memory.
memLimit: 402653184 # 384Mi; container limit is 512Mi
accessLog: false

otel:
  # OTLP/HTTP JSON traces. Empty disables. Example: http://otel-collector:4318
  endpoint: ""
  serviceName: mocache

# In-process drain after SIGTERM: fail /readyz, wait, then close sockets.
# Must be shorter than terminationGracePeriodSeconds.
drain: 5s
janitor: 30s

ports:
  http: 8090
  rpc: 8091
  resp: 6379

# Redis-protocol front end (docs/redis.md). Off by default: the port only opens
# when you ask for it.
resp:
  enabled: false
  # Require AUTH. Stored in a Secret and passed as MOCACHE_PASSWORD, never as a
  # command-line argument.
  password: ""
  idle: 0s
  # Redis Cluster mode (docs/cluster.md). Slots are divided evenly across the
  # primaries and each pod announces its own stable DNS name, so cluster
  # clients can shard across the StatefulSet.
  #
  # Changing the shard count reassigns slots and drops the keys that move:
  # there is no live slot migration.
  cluster:
    enabled: false
    # Pods per shard. 1 = primaries only: a pod being down takes its slots
    # with it. 2 = one replica each, which is what makes a shard survive the
    # loss of its primary.
    #
    # replicaCount must equal shards * replicasPerShard, and shards must be
    # odd and >= 3: a promotion needs a majority of primaries to agree, and an
    # even number of primaries has no majority after a split.
    shards: 3
    replicasPerShard: 2
    # Gossip, replication and automatic failover on the bus port (client port
    # + 10000). Disable to keep sharding without replication.
    bus: true
    nodeTimeout: 5s
    failoverDelay: 500ms
    # Move a spare replica to a shard that has lost all of its own, so one
    # crash cannot leave a shard unable to fail over. Needs replicasPerShard > 1
    # somewhere in the cluster to have a spare to move.
    replicaMigration: true
    backlogBytes: 33554432

service:
  annotations: {}

podAnnotations: {}

updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    partition: 0

podManagementPolicy: OrderedReady

terminationGracePeriodSeconds: 30

podDisruptionBudget:
  enabled: true
  minAvailable: 2

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

probes:
  liveness:
    path: /livez
    port: http
    periodSeconds: 10
    timeoutSeconds: 1
    failureThreshold: 3
  readiness:
    path: /readyz
    port: http
    periodSeconds: 2
    timeoutSeconds: 1
    failureThreshold: 2
  startup:
    path: /livez
    port: http
    periodSeconds: 2
    timeoutSeconds: 1
    failureThreshold: 30

securityContext:
  pod:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  container:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

nodeSelector: {}
tolerations: []
affinity: {}
