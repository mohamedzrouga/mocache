apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "mocache.fullname" . }}
  labels:
    {{- include "mocache.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "mocache.fullname" . }}-headless
  replicas: {{ .Values.replicaCount }}
  podManagementPolicy: {{ .Values.podManagementPolicy }}
  updateStrategy:
    {{- toYaml .Values.updateStrategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "mocache.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mocache.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.securityContext.pod | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: mocache
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - -http=:{{ .Values.ports.http }}
            - -rpc=:{{ .Values.ports.rpc }}
            {{- if .Values.resp.enabled }}
            - -resp=:{{ .Values.ports.resp }}
            - -resp-idle={{ .Values.resp.idle }}
            {{- if .Values.resp.cluster.enabled }}
            {{- $full := include "mocache.fullname" . }}
            {{- $ns := .Release.Namespace }}
            {{- $port := .Values.ports.resp }}
            {{- $n := int .Values.replicaCount }}
            # $(POD_NAME) is expanded by the kubelet from the env below, so each
            # pod announces its own stable DNS name from one shared pod spec.
            - -cluster-announce=$(POD_NAME).{{ $full }}-headless.{{ $ns }}.svc.cluster.local:{{ $port }}
            {{- range $i := until $n }}
            - -cluster-peer={{ $full }}-{{ $i }}.{{ $full }}-headless.{{ $ns }}.svc.cluster.local:{{ $port }}={{ div (mul $i 16384) $n }}-{{ sub (div (mul (add $i 1) 16384) $n) 1 }}
            {{- end }}
            {{- end }}
            {{- end }}
            - -capacity={{ int64 .Values.capacity }}
            - -max-bytes={{ int64 .Values.maxBytes }}
            - -max-value={{ int64 .Values.maxValue }}
            - -max-key={{ int64 .Values.maxKey }}
            - -mem-limit={{ int64 .Values.memLimit }}
            - -drain={{ .Values.drain }}
            - -janitor={{ .Values.janitor }}
            {{- if .Values.accessLog }}
            - -access-log
            {{- end }}
            {{- if .Values.otel.endpoint }}
            - -otel-endpoint={{ .Values.otel.endpoint }}
            - -otel-service={{ .Values.otel.serviceName }}
            {{- end }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- if and .Values.resp.enabled .Values.resp.password }}
            - name: MOCACHE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "mocache.fullname" . }}-auth
                  key: password
            {{- end }}
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.otel.serviceName | quote }}
            {{- if .Values.otel.endpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.endpoint | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.ports.http }}
            - name: grpc
              containerPort: {{ .Values.ports.rpc }}
            {{- if .Values.resp.enabled }}
            - name: resp
              containerPort: {{ .Values.ports.resp }}
            {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext.container | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path }}
              port: {{ .Values.probes.startup.port }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: {{ .Values.probes.liveness.port }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: {{ .Values.probes.readiness.port }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
