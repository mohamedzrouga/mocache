{{- if and .Values.resp.enabled .Values.resp.password }}
# RESP AUTH password. Kept in a Secret and read through MOCACHE_PASSWORD rather
# than passed as -resp-password, so it does not appear in the pod spec's args
# or in the process command line.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mocache.fullname" . }}-auth
  labels:
    {{- include "mocache.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ .Values.resp.password | quote }}
{{- end }}
