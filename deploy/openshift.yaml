apiVersion: v1
kind: Service
metadata:
  name: cache-headless
  labels:
    app: mocache
spec:
  clusterIP: None
  publishNotReadyAddresses: false
  selector:
    app: mocache
  ports:
    - name: http
      port: 8090
      targetPort: http
    - name: grpc
      port: 8091
      targetPort: grpc
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cache
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: mocache
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cache
  labels:
    app: mocache
spec:
  serviceName: cache-headless
  replicas: 3
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app: mocache
  template:
    metadata:
      labels:
        app: mocache
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mocache
          image: mocache:0.1.0
          args:
            - -http=:8090
            - -rpc=:8091
            - -capacity=100000
            - -max-bytes=268435456
            - -mem-limit=402653184
            - -drain=5s
            - -janitor=30s
          ports:
            - name: http
              containerPort: 8090
            - name: grpc
              containerPort: 8091
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 2
