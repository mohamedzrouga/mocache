apiVersion: v1
kind: Service
metadata:
  name: cache-headless
  labels:
    app: mocache
spec:
  clusterIP: None
  publishNotReadyAddresses: false
  selector:
    app: mocache
  ports:
    - name: http
      port: 8090
      targetPort: http
    - name: grpc
      port: 8091
      targetPort: grpc
    - name: resp
      port: 6379
      targetPort: resp
    - name: bus
      port: 16379
      targetPort: bus
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cache
spec:
  # Keep a majority of primaries available so a failover can still win a vote.
  minAvailable: 4
  selector:
    matchLabels:
      app: mocache
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cache
  labels:
    app: mocache
spec:
  serviceName: cache-headless
  # 3 shards x 2 pods: ordinals 0-2 are primaries, 3-5 their replicas.
  replicas: 6
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app: mocache
  template:
    metadata:
      labels:
        app: mocache
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mocache
          image: mocache:0.1.0
          args:
            - -http=:8090
            - -rpc=:8091
            # Redis-protocol front end in cluster mode. Pods 0-2 are primaries
            # splitting the 16384 slots; pods 3-5 replicate them, which is what
            # lets a shard survive the loss of its primary. $(POD_NAME) comes
            # from the downward API below: that is how one pod spec gives each
            # pod its own announce address. See docs/cluster.md.
            - -resp=:6379
            - -cluster-announce=$(POD_NAME).cache-headless:6379
            - -cluster-node-timeout=5s
            - -cluster-peer=cache-0.cache-headless:6379=0-5460
            - -cluster-peer=cache-1.cache-headless:6379=5461-10921
            - -cluster-peer=cache-2.cache-headless:6379=10922-16383
            - -cluster-peer=cache-3.cache-headless:6379=replica-of:cache-0.cache-headless:6379
            - -cluster-peer=cache-4.cache-headless:6379=replica-of:cache-1.cache-headless:6379
            - -cluster-peer=cache-5.cache-headless:6379=replica-of:cache-2.cache-headless:6379
            - -capacity=100000
            - -max-bytes=268435456
            - -mem-limit=402653184
            - -drain=5s
            - -janitor=30s
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: http
              containerPort: 8090
            - name: grpc
              containerPort: 8091
            - name: resp
              containerPort: 6379
            # Cluster bus: node-to-node gossip, replication and votes.
            # Never expose this to clients.
            - name: bus
              containerPort: 16379
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 2
