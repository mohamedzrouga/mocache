apiVersion: v1
kind: Service
metadata:
  name: cache-headless
  labels:
    app: mocache
spec:
  clusterIP: None
  selector:
    app: mocache
  ports:
    - name: http
      port: 8090
      targetPort: http
    - name: grpc
      port: 8091
      targetPort: grpc
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cache
  labels:
    app: mocache
spec:
  serviceName: cache-headless
  replicas: 3
  selector:
    matchLabels:
      app: mocache
  template:
    metadata:
      labels:
        app: mocache
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mocache
          image: mocache:0.1.0
          args:
            - -http=:8090
            - -rpc=:8091
            - -capacity=100000
          ports:
            - name: http
              containerPort: 8090
            - name: grpc
              containerPort: 8091
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
